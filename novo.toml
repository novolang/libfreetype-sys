[package]
name        = "libfreetype-sys"
version     = "0.1.0"
description = "Bindings over libfreetype, the FreeType font engine: the library, the face, the character maps, the sizes, the glyph loader and renderer, the outline and bitmap helpers, the SFNT tables and the fixed-point arithmetic, one declaration per C entry point."
license     = "Apache-2.0"

# NOT a `0.0.x` draft.  An interface release is the shape whose every
# `pub fn` body is a `todo()`, and every `pub fn` here is an `@ffi`
# declaration with no body at all — `novo pkg publish` reads that as a
# release with bodies and refuses a `0.0.x` version for it.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` below is an `@ffi` declaration of
# a function in libfreetype.
layer       = "sys"

category    = "bindings"

# The one C library.  `libfreetype.so` is what the loader resolves these
# symbols against; installing this package does not install it.
wraps       = "libfreetype"

tags        = ["ffi", "freetype", "font", "text", "glyph", "rasteriser", "bindings"]
repository  = "https://github.com/novolang/libfreetype-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of libfreetype, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "freetype"` name every declaration in
# `src/` carries.  `libfreetype-dev` installs
# `/usr/lib/<arch>/pkgconfig/freetype2.pc`, so pkg-config answers
# `-lfreetype` on Debian and Ubuntu.  The package name is `freetype2`
# and the library name is `freetype`; without the block the default is
# `-lfreetype`, which is the same flag on a system that put the library
# somewhere the linker already looks.
[ffi.freetype]
pkg_config = "freetype2"
